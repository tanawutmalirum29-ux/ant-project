name: UI Renovation Default Cutover and Legacy Rollback
on:
  push:
    branches: [fix/renovation-default-ui-and-legacy-rollback, main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/browser-ui-renovation-default.py'
      - '.github/workflows/ui-renovation-default.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tools/browser-ui-renovation-default.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  default-ui-chromium-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Native regression and build
        run: |
          npm test
          npm run build
      - name: Install browsers
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Default UI and explicit rollback hit-testing
        run: python tools/browser-ui-renovation-default.py
      - name: Preserve evidence even if test failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-default-14-viewport-chromium-webkit
          path: artifacts/ui-default/
          if-no-files-found: warn
