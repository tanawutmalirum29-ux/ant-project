name: UI Renovation G3 Engineer A Integration
on:
  push:
    branches: [feat/ui-renovation-v1-integration]
    paths:
      - 'src/ui/renovation/**'
      - 'src/main.js'
      - 'index.html'
      - 'tools/browser-ui-renovation-g3-a.py'
      - 'tools/browser-smoke.py'
      - '.github/workflows/ui-renovation-g3-a.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ui/renovation/**'
      - 'src/main.js'
      - 'index.html'
      - 'tools/browser-ui-renovation-g3-a.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  g3-a-real-game:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Full game regression
        run: npm test
      - name: Build shipped website
        run: npm run build
      - name: Install real Chromium and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: G3 actual pointer and dialog QA 6 viewports x 2 engines
        run: python tools/browser-ui-renovation-g3-a.py
      - name: Preserve G3 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-engineer-a-chromium-webkit
          path: artifacts/g3-engineer-a/*.png
          if-no-files-found: warn
