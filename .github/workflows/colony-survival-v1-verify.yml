# CEO-SURVIVAL — scoped native and browser evidence for COLONY_SURVIVAL_LOOP_V1.
# This workflow is test infrastructure only; it does not publish or merge code.
name: Colony Survival V1 — Feature Native and Browser QA

on:
  push:
    branches:
      - feat/survival-repeat-nursery-g2
  pull_request:
    branches:
      - feat/colony-survival-v1-integration
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    name: Native game tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record and verify exact checked-out commit
        shell: bash
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run full native Node regression suite
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Verify generated site files
        run: |
          test -s dist/index.html
          test -s dist/src/main.js

  chromium-webkit:
    name: Chromium and WebKit UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record and verify exact checked-out commit
        shell: bash
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Default UI plus explicit legacy rollback browser smoke
        run: python tools/browser-ui-renovation-default.py
      - name: Six-viewport legacy and foundation browser regression
        run: python tools/browser-ui-renovation-g1.py
      - name: Existing Nursery interaction smoke
        run: python tools/browser-nursery.py
      - name: Retain browser artifacts on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colony-survival-v1-browser-evidence
          path: |
            artifacts/ui-default/
            artifacts/g1-shell/
          if-no-files-found: warn
