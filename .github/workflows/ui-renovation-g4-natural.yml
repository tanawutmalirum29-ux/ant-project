name: UI Renovation G4 Natural Nursery Lifecycle
on:
  push:
    branches: [feat/ui-renovation-v1-integration]
    paths:
      - 'src/**'
      - 'tools/browser-ui-renovation-g4-natural.py'
      - '.github/workflows/ui-renovation-g4-natural.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/browser-ui-renovation-g4-natural.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  g4-natural-nursery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate exact tested commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real Nursery construction, physical haul, and hatch
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/browser-ui-renovation-g4-natural.py
      - name: Preserve natural lifecycle evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-natural-nursery-evidence
          path: artifacts/g4-natural/
          if-no-files-found: warn
